name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "clients/web/**"

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test web client
        run: npm run test --workspace=web

      - name: Build web client
        run: npm run build --workspace=web
        env:
          # The relay's WebSocket URL, baked into the client bundle. Set as a
          # repo Actions variable to the ws_custom_domain_url Terraform output.
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_WEB }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync clients/web/dist/ s3://${{ vars.SITE_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
